name: Build and release .deb

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build-deb.sh | tee build.log
          # Record which backend/frontend commits this release pins, so
          # nobody has to unpack the .deb to find out.
          {
            echo "## Pinned commits"
            grep -E '^  c4raven-(server|ui) ' build.log | sed 's/^ */- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/c4raven-server_${{ steps.version.outputs.version }}_all.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
