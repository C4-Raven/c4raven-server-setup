# /etc/c4raven-server/setup.conf -- answers for the c4raven-server setup.
#
# WHY THIS FILE EXISTS
# --------------------
# The Debian package asks these questions with debconf, before anything is
# unpacked. RPM has no debconf and no equivalent: %post is expected to run
# unattended, may have no controlling terminal at all (dnf under Ansible,
# kickstart, a container build), and `rpm` offers no mechanism for asking the
# admin anything. So the RPM reads its answers from here instead.
#
# Precedence is: environment variable > this file > built-in default. An
# unattended install can therefore skip the file entirely:
#
#     RAVEN_DOMAIN=tak.example.org dnf install ./c4raven-server-2.2.3-1.el9.noarch.rpm
#
# This file is %config(noreplace): a package upgrade never overwrites your
# answers. It is mode 0600 because RAVEN_TURNSTILE_SECRET_KEY passes through it.
#
# HOW TO (RE)RUN THE SETUP
# ------------------------
# Installing the package runs the setup once with whatever answers are in
# place. Edit this file afterwards and apply it with:
#
#     sudo c4raven-setup
#
# That is the same code path %post uses and it is safe to run any number of
# times: every step checks for existing state before creating it, and it will
# not reissue a certificate or reset a password you already have.

# Public domain name for this server (optional).
# If this server has a public domain name that already points at its IP, set it
# here to get a real Let's Encrypt certificate via certbot and let Federation
# Hub be reachable by hostname. Leave blank to use the self-signed certificate
# from this server's own CA and access it by IP address instead -- you can
# always run certbot by hand later.
RAVEN_DOMAIN=

# Address certbot registers with Let's Encrypt. Defaults to admin@$RAVEN_DOMAIN.
RAVEN_CERTBOT_EMAIL=

# Cloudflare Turnstile on the login page: adds a human-verification checkbox.
# You need a site key and secret key from the Cloudflare dashboard's Turnstile
# section before setting this to true.
RAVEN_TURNSTILE_ENABLE=false
RAVEN_TURNSTILE_SITE_KEY=
# Consumed on the first successful setup run and blanked out here afterwards --
# from then on it lives only in /opt/raven/data/config.yml.
RAVEN_TURNSTILE_SECRET_KEY=

# ---------------------------------------------------------------------------
# EL-specific knobs. These have no Debian counterpart; they exist because
# Enterprise Linux enforces things Ubuntu does not.
# ---------------------------------------------------------------------------

# Python used to build the backend venv. EL9's /usr/bin/python3 is 3.9 and
# c4raven-server requires >=3.10, so the default is the AppStream python3.12.
RAVEN_PYTHON=python3.12

# Open the ports the server listens on in firewalld (80, 443, 8080, 8443, 8446,
# 8322, 1936, 8883 tcp; 8554, 1935 tcp; 8189, 8890 udp). Set to false if you
# manage the firewall yourself -- the server will install but be unreachable
# from anywhere but localhost until you open them.
RAVEN_OPEN_FIREWALL=true

# Apply the SELinux policy the stack needs (httpd_can_network_connect, the
# http_port_t labels for 8446/8322/1936/8883, cert_t on /opt/raven/data/ca).
# Set to false only if you ship your own policy module; with SELinux enforcing
# and this off, nginx will 502 every API request and fail to bind 8446.
RAVEN_SELINUX_FIXUP=true
